<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            width: 400px;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        #qrCode {
            margin-top: 20px;
        }

        img {
            max-width: 250px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>QR Code Generator</h2>

        <input
            type="text"
            id="qrText"
            placeholder="Enter text or URL">

        <button onclick="generateQR()">
            Generate QR Code
        </button>

        <div id="qrCode"></div>
    </div>

    <script>
        function generateQR() {

            const text =
                document.getElementById("qrText").value.trim();

            if (!text) {
                alert("Please enter text or URL");
                return;
            }

            const qrUrl =
                "https://api.qrserver.com/v1/create-qr-code/" +
                "?size=250x250&data=" +
                encodeURIComponent(text);

            document.getElementById("qrCode").innerHTML =
                `<img src="${qrUrl}" alt="QR Code">`;
        }
    </script>

</body>
</html>
