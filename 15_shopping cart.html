<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart Demo</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    text-align:center;
}

.card h3{
    margin-bottom:10px;
}

.price{
    color:green;
    font-size:20px;
    margin:10px 0;
}

button{
    padding:10px 15px;
    border:none;
    background:#3498db;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

.cart{
    margin-top:30px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.cart-item{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
    border-bottom:1px solid #ddd;
    padding-bottom:10px;
}

.total{
    font-size:22px;
    font-weight:bold;
    margin-top:15px;
}
</style>
</head>
<body>

<div class="container">

    <h1>Shopping Cart Example</h1>

    <div class="products">

        <div class="card">
            <h3>Wireless Headphones</h3>
            <div class="price">$99</div>
            <button onclick="addToCart('Wireless Headphones', 99)">
                Add to Cart
            </button>
        </div>

        <div class="card">
            <h3>Smart Watch</h3>
            <div class="price">$149</div>
            <button onclick="addToCart('Smart Watch', 149)">
                Add to Cart
            </button>
        </div>

        <div class="card">
            <h3>Bluetooth Speaker</h3>
            <div class="price">$79</div>
            <button onclick="addToCart('Bluetooth Speaker', 79)">
                Add to Cart
            </button>
        </div>

    </div>

    <div class="cart">
        <h2>Shopping Cart</h2>

        <div id="cartItems">
            <p>No items added yet.</p>
        </div>

        <div class="total">
            Total: $<span id="total">0</span>
        </div>
    </div>

</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price) {
    cart.push({ name, price });
    total += price;

    updateCart();
}

function updateCart() {
    const cartItems = document.getElementById("cartItems");
    cartItems.innerHTML = "";

    cart.forEach((item, index) => {
        cartItems.innerHTML += `
            <div class="cart-item">
                <span>${item.name}</span>
                <span>$${item.price}</span>
            </div>
        `;
    });

    if(cart.length === 0){
        cartItems.innerHTML = "<p>No items added yet.</p>";
    }

    document.getElementById("total").textContent = total;
}
</script>

</body>
</html>
