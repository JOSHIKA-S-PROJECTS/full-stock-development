<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

:root{
    --primary:#2563eb;
    --dark:#0f172a;
    --light:#f8fafc;
    --border:#e2e8f0;
    --text:#334155;
}

body{
    background:var(--light);
    color:var(--text);
}

/* Layout */
.admin-layout{
    display:flex;
    min-height:100vh;
}

/* Sidebar */
.sidebar{
    width:270px;
    background:var(--dark);
    color:white;
    position:fixed;
    height:100%;
    padding:25px;
    overflow-y:auto;
}

.logo{
    font-size:24px;
    font-weight:700;
    margin-bottom:35px;
}

.menu-title{
    font-size:12px;
    text-transform:uppercase;
    opacity:.6;
    margin:20px 0 10px;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    margin-bottom:8px;
}

.sidebar a{
    display:block;
    text-decoration:none;
    color:#cbd5e1;
    padding:12px 15px;
    border-radius:10px;
    transition:.3s;
}

.sidebar a:hover,
.sidebar a.active{
    background:var(--primary);
    color:white;
}

/* Main */
.main{
    flex:1;
    margin-left:270px;
    padding:25px;
}

/* Topbar */
.topbar{
    background:white;
    border-radius:16px;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.search{
    width:320px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
}

.admin-info{
    display:flex;
    align-items:center;
    gap:15px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:var(--primary);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

/* Cards */
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.card h4{
    color:#64748b;
    margin-bottom:10px;
}

.card .number{
    font-size:32px;
    font-weight:700;
    color:var(--primary);
}

/* Content Grid */
.content{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

/* Chart */
.chart-box{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.chart-placeholder{
    height:320px;
    margin-top:20px;
    border-radius:12px;
    background:linear-gradient(135deg,#dbeafe,#bfdbfe);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    color:#1d4ed8;
    font-weight:600;
}

/* Activity */
.activity{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.activity-item{
    padding:15px 0;
    border-bottom:1px solid var(--border);
}

.activity-item:last-child{
    border:none;
}

.activity-item small{
    color:#64748b;
}

/* Users Table */
.table-container{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

table th,
table td{
    padding:14px;
    border-bottom:1px solid var(--border);
    text-align:left;
}

.status{
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.active{
    background:#dcfce7;
    color:#15803d;
}

.pending{
    background:#fef3c7;
    color:#b45309;
}

.inactive{
    background:#fee2e2;
    color:#b91c1c;
}

/* Buttons */
.btn{
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    color:white;
}

.edit{
    background:#2563eb;
}

.delete{
    background:#dc2626;
}

/* Responsive */
@media(max-width:1000px){

    .content{
        grid-template-columns:1fr;
    }
}

@media(max-width:850px){

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
    }

    .topbar{
        flex-direction:column;
        gap:15px;
        align-items:flex-start;
    }

    .search{
        width:100%;
    }
}
</style>
</head>
