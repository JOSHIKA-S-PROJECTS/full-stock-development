<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Mode UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
    transition:all 0.3s ease;
}

:root{
    --bg-color:#f4f6f9;
    --card-color:#ffffff;
    --text-color:#333333;
    --primary:#4f46e5;
}

.dark-mode{
    --bg-color:#121212;
    --card-color:#1e1e1e;
    --text-color:#ffffff;
}

body{
    background:var(--bg-color);
    color:var(--text-color);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
}

.card{
    background:var(--card-color);
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
    width:350px;
}

.card h2{
    margin-bottom:15px;
}

.card p{
    margin-bottom:25px;
    line-height:1.6;
}

/* Toggle Switch */
.toggle{
    position:relative;
    display:inline-block;
    width:70px;
    height:35px;
}

.toggle input{
    display:none;
}

.slider{
    position:absolute;
    cursor:pointer;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:#ccc;
    border-radius:35px;
}

.slider:before{
    content:"";
    position:absolute;
    width:28px;
    height:28px;
    left:4px;
    bottom:3.5px;
    background:white;
    border-radius:50%;
    transition:0.3s;
}

input:checked + .slider{
    background:var(--primary);
}

input:checked + .slider:before{
    transform:translateX(34px);
}
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Dark Mode UI</h2>
        <p>
            Click the toggle switch below to switch between
            light mode and dark mode.
        </p>

        <label class="toggle">
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
        </label>
    </div>
</div>

<script>
const toggle = document.getElementById("themeToggle");

toggle.addEventListener("change", () => {
    document.body.classList.toggle("dark-mode");
});
</script>

</body>
</html>
