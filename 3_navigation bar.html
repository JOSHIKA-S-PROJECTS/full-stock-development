<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Navigation Bar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
}

/* Navigation */
.navbar{
    background:#1e293b;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.nav-links{
    display:flex;
    list-style:none;
}

.nav-links li{
    margin-left:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:16px;
    padding:8px 12px;
    border-radius:5px;
    transition:0.3s;
}

.nav-links a:hover{
    background:#334155;
}

.cta-btn{
    background:#3b82f6;
    color:white;
    padding:10px 18px;
    border-radius:5px;
}

.cta-btn:hover{
    background:#2563eb;
}

/* Mobile Menu Button */
.menu-toggle{
    display:none;
    flex-direction:column;
    cursor:pointer;
}

.menu-toggle span{
    width:28px;
    height:3px;
    background:white;
    margin:4px 0;
    transition:0.3s;
}

/* Responsive */
@media(max-width:768px){

    .menu-toggle{
        display:flex;
    }

    .nav-links{
        position:absolute;
        top:70px;
        left:0;
        width:100%;
        background:#1e293b;
        flex-direction:column;
        display:none;
        text-align:center;
    }

    .nav-links.active{
        display:flex;
    }

    .nav-links li{
        margin:15px 0;
    }
}

/* Demo Content */
.hero{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f1f5f9;
    font-size:2rem;
    color:#334155;
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo">MyWebsite</div>

    <ul class="nav-links" id="navLinks">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#" class="cta-btn">Get Started</a></li>
    </ul>

    <div class="menu-toggle" id="menuToggle">
        <span></span>
        <span></span>
        <span></span>
    </div>
</nav>

<section class="hero">
    Responsive Navigation Bar
</section>

<script>
const menuToggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");

menuToggle.addEventListener("click", () => {
    navLinks.classList.toggle("active");
});
</script>

</body>
</html>
