<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings Management</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}

.settings-container{
    max-width:900px;
    margin:auto;
    background:#fff;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    overflow:hidden;
}

.header{
    background:#2c3e50;
    color:#fff;
    padding:20px;
}

.header h1{
    font-size:28px;
}

.settings-content{
    padding:25px;
}

.section{
    margin-bottom:30px;
}

.section h2{
    margin-bottom:15px;
    color:#333;
    border-bottom:2px solid #eee;
    padding-bottom:10px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
    color:#555;
}

input[type="text"],
input[type="email"],
input[type="password"],
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

.checkbox-group{
    margin:10px 0;
}

.checkbox-group label{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:normal;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
}

.btn{
    padding:12px 25px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

.save-btn{
    background:#27ae60;
    color:white;
}

.cancel-btn{
    background:#e74c3c;
    color:white;
}

.save-btn:hover{
    background:#219150;
}

.cancel-btn:hover{
    background:#c0392b;
}

@media(max-width:768px){
    .buttons{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}
</style>
</head>
<body>

<div class="settings-container">

    <div class="header">
        <h1>Settings Management</h1>
    </div>

    <div class="settings-content">

        <!-- Profile Settings -->
        <div class="section">
            <h2>Profile Settings</h2>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Language</label>
                <select>
                    <option>English</option>
                    <option>Tamil</option>
                    <option>Hindi</option>
                </select>
            </div>
        </div>

        <!-- Notification Settings -->
        <div class="section">
            <h2>Notification Settings</h2>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" checked>
                    Email Notifications
                </label>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox">
                    SMS Notifications
                </label>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" checked>
                    Push Notifications
                </label>
            </div>
        </div>

        <!-- Security Settings -->
        <div class="section">
            <h2>Security Settings</h2>

            <div class="form-group">
                <label>Current Password</label>
                <input type="password">
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password">
            </div>
        </div>

        <div class="buttons">
            <button class="btn save-btn">Save Changes</button>
            <button class="btn cancel-btn">Cancel</button>
        </div>

    </div>

</div>

</body>
</html>
