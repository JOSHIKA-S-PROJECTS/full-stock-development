<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Delivery Platform</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#ff5722;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.food-card{
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.food-card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:8px;
}

.food-card h3{
    margin:10px 0;
}

.food-card p{
    color:#555;
}

.price{
    font-size:20px;
    color:#ff5722;
    font-weight:bold;
    margin:10px 0;
}

button{
    background:#ff5722;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.cart{
    background:white;
    margin-top:30px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th,
table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

table th{
    background:#ff5722;
    color:white;
}

.total{
    text-align:right;
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
}

.order-btn{
    margin-top:15px;
    width:100%;
}
</style>
</head>
<body>

<header>
    <h1>Food Delivery Platform</h1>
</header>

<div class="container">

    <div class="menu-grid" id="menuGrid"></div>

    <div class="cart">
        <h2>Shopping Cart</h2>

        <table>
            <thead>
                <tr>
                    <th>Food</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="cartTable"></tbody>
        </table>

        <div class="total">
            Grand Total: ₹<span id="grandTotal">0</span>
        </div>

        <button class="order-btn"
                onclick="placeOrder()">
            Place Order
        </button>
    </div>

</div>

<script>

const menu = [

{
    id:1,
    name:"Burger",
    price:150,
    image:"https://via.placeholder.com/300x180?text=Burger"
},

{
    id:2,
    name:"Pizza",
    price:300,
    image:"https://via.placeholder.com/300x180?text=Pizza"
},

{
    id:3,
    name:"Pasta",
    price:220,
    image:"https://via.placeholder.com/300x180?text=Pasta"
},

{
    id:4,
    name:"Fried Rice",
    price:180,
    image:"https://via.placeholder.com/300x180?text=Fried+Rice"
},

{
    id:5,
    name:"Sandwich",
    price:120,
    image:"https://via.placeholder.com/300x180?text=Sandwich"
}

];

let cart = [];

function loadMenu(){

    const menuGrid =
        document.getElementById("menuGrid");

    menu.forEach(item => {

        menuGrid.innerHTML += `
        <div class="food-card">

            <img src="${item.image}"
                 alt="${item.name}">

            <h3>${item.name}</h3>

            <div class="price">
                ₹${item.price}
            </div>

            <button
            onclick="addToCart(${item.id})">
            Add to Cart
            </button>

        </div>
        `;
    });
}

function addToCart(id){

    let item =
        cart.find(product => product.id === id);

    if(item){

        item.qty++;

    }else{

        let food =
            menu.find(product => product.id === id);

        cart.push({
            ...food,
            qty:1
        });
    }

    renderCart();
}

function renderCart(){

    const table =
        document.getElementById("cartTable");

    table.innerHTML = "";

    let total = 0;

    cart.forEach(item => {

        let rowTotal =
            item.price * item.qty;

        total += rowTotal;

        table.innerHTML += `
        <tr>

            <td>${item.name}</td>

            <td>₹${item.price}</td>

            <td>${item.qty}</td>

            <td>₹${rowTotal}</td>

            <td>
                <button
                onclick="removeItem(${item.id})">
                Remove
                </button>
            </td>

        </tr>
        `;
    });

    document.getElementById("grandTotal")
        .innerText = total;
}

function removeItem(id){

    cart =
        cart.filter(item => item.id !== id);

    renderCart();
}

function placeOrder(){

    if(cart.length === 0){

        alert("Cart is empty!");
        return;
    }

    alert(
        "Order placed successfully!\n" +
        "Total Amount: ₹" +
        document.getElementById("grandTotal").innerText
    );

    cart = [];
    renderCart();
}

loadMenu();

</script>

</body>
</html>
