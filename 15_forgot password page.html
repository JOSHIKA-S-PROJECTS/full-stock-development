<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    padding:20px;
}

/* Container */
.forgot-container{
    width:100%;
    max-width:450px;
    background:#ffffff;
    border-radius:20px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,0.15);
    text-align:center;
}

/* Icon */
.icon-box{
    width:90px;
    height:90px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#eff6ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

/* Heading */
h1{
    color:#0f172a;
    margin-bottom:10px;
}

.description{
    color:#64748b;
    line-height:1.7;
    margin-bottom:30px;
}

/* Form */
.form-group{
    text-align:left;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:0.3s;
}

input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

.reset-btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.reset-btn:hover{
    background:#1d4ed8;
}

/* Links */
.links{
    margin-top:25px;
}

.links a{
    display:block;
    text-decoration:none;
    color:#2563eb;
    margin:10px 0;
    font-weight:500;
}

.links a:hover{
    text-decoration:underline;
}

/* Responsive */
@media(max-width:500px){

    .forgot-container{
        padding:30px 20px;
    }

    h1{
        font-size:1.8rem;
    }
}
</style>
</head>
<body>

<div class="forgot-container">

    <div class="icon-box">
        🔒
    </div>

    <h1>Forgot Password?</h1>

    <p class="description">
        Enter your registered email address and we'll send
        you instructions to reset your password.
    </p>

    <form>

        <div class="form-group">
            <label>Email Address</label>

            <input
                type="email"
                placeholder="Enter your email address"
                required>
        </div>

        <button type="submit" class="reset-btn">
            Send Reset Link
        </button>

    </form>

    <div class="links">
        <a href="#">← Back to Login</a>
        <a href="#">Create New Account</a>
    </div>

</div>

</body>
</html>
