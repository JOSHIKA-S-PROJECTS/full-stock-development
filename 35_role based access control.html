<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Role Based Access Control</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f4f4f4;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
    }

    select, button {
        padding: 10px;
        margin: 10px 0;
        width: 100%;
    }

    .card {
        padding: 15px;
        margin-top: 10px;
        border-radius: 5px;
        background: #e9ecef;
        display: none;
    }

    h2 {
        text-align: center;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Role Based Access Control</h2>

    <label>Select User Role:</label>
    <select id="role">
        <option value="">Choose Role</option>
        <option value="admin">Admin</option>
        <option value="manager">Manager</option>
        <option value="user">User</option>
    </select>

    <button onclick="checkAccess()">Login</button>

    <div id="adminPanel" class="card">
        <h3>Admin Dashboard</h3>
        <p>Manage users, settings, and system configuration.</p>
    </div>

    <div id="managerPanel" class="card">
        <h3>Manager Dashboard</h3>
        <p>View reports and manage team activities.</p>
    </div>

    <div id="userPanel" class="card">
        <h3>User Dashboard</h3>
        <p>Access personal profile and account information.</p>
    </div>
</div>

<script>
function checkAccess() {

    const role = document.getElementById("role").value;

    document.getElementById("adminPanel").style.display = "none";
    document.getElementById("managerPanel").style.display = "none";
    document.getElementById("userPanel").style.display = "none";

    switch(role) {

        case "admin":
            document.getElementById("adminPanel").style.display = "block";
            document.getElementById("managerPanel").style.display = "block";
            document.getElementById("userPanel").style.display = "block";
            break;

        case "manager":
            document.getElementById("managerPanel").style.display = "block";
            document.getElementById("userPanel").style.display = "block";
            break;

        case "user":
            document.getElementById("userPanel").style.display = "block";
            break;

        default:
            alert("Please select a role.");
    }
}
</script>

</body>
</html>
