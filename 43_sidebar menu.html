<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Sidebar Menu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    display:flex;
    min-height:100vh;
    background:#f4f6f9;
}

/* Sidebar */
.sidebar{
    width:260px;
    background:#1e293b;
    color:#fff;
    position:fixed;
    top:0;
    left:0;
    height:100%;
    overflow-y:auto;
    transition:0.3s;
}

.logo{
    padding:25px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.menu{
    list-style:none;
    padding:15px 0;
}

.menu li{
    margin:5px 12px;
}

.menu li a{
    text-decoration:none;
    color:#cbd5e1;
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    border-radius:10px;
    transition:0.3s;
}

.menu li a:hover,
.menu li a.active{
    background:#3b82f6;
    color:#fff;
}

.icon{
    font-size:18px;
}

/* Content */
.main-content{
    margin-left:260px;
    padding:30px;
    width:100%;
}

.header{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    margin-bottom:25px;
}

.card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.card h3{
    margin-bottom:10px;
    color:#1e293b;
}

.card p{
    color:#64748b;
}

/* Mobile Toggle */
.toggle-btn{
    display:none;
    position:fixed;
    top:15px;
    left:15px;
    z-index:1000;
    background:#3b82f6;
    color:#fff;
    border:none;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
}

/* Responsive */
@media(max-width:768px){

    .sidebar{
        left:-260px;
    }

    .sidebar.active{
        left:0;
    }

    .main-content{
        margin-left:0;
        padding-top:70px;
    }

    .toggle-btn{
        display:block;
    }
}
</style>
</head>
<body>

<button class="toggle-btn" onclick="toggleSidebar()">
☰
</button>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">

    <div class="logo">
        MyApp
    </div>

    <ul class="menu">
        <li>
            <a href="#" class="active">
                <span class="icon">🏠</span>
                Dashboard
            </a>
        </li>

        <li>
            <a href="#">
                <span class="icon">👤</span>
                Profile
            </a>
        </li>

        <li>
            <a href="#">
                <span class="icon">📊</span>
                Analytics
            </a>
        </li>

        <li>
            <a href="#">
                <span class="icon">📦</span>
                Products
            </a>
        </li>

        <li>
            <a href="#">
                <span class="icon">🛒</span>
                Orders
            </a>
        </li>

        <li>
            <a href="#">
                <span class="icon">💬</span>
                Messages
            </a>
        </li>

        <li>
            <a href="#">
                <span class="icon">⚙️</span>
                Settings
            </a>
        </li>

        <li>
            <a href="#">
                <span class="icon">🚪</span>
                Logout
            </a>
        </li>
    </ul>

</div>

<!-- Main Content -->
<div class="main-content">

    <div class="header">
        <h1>Dashboard</h1>
        <p>Welcome to your admin panel.</p>
    </div>

    <div class="card-grid">

        <div class="card">
            <h3>Total Users</h3>
            <p>12,450 Active Users</p>
        </div>

        <div class="card">
            <h3>Total Sales</h3>
            <p>$48,900 This Month</p>
        </div>

        <div class="card">
            <h3>Orders</h3>
            <p>1,245 Pending Orders</p>
        </div>

        <div class="card">
            <h3>Revenue</h3>
            <p>$125,000 Annual Revenue</p>
        </div>

    </div>

</div>

<script>
function toggleSidebar() {
    document
        .getElementById("sidebar")
        .classList.toggle("active");
}
</script>

</body>
</html>
