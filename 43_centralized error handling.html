<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centralized Error Handling</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
    }

    button {
        padding: 10px 20px;
        margin: 10px 5px;
        cursor: pointer;
    }

    #message {
        margin-top: 20px;
        padding: 15px;
        border-radius: 5px;
        display: none;
    }

    .success {
        background: #d4edda;
        color: #155724;
    }

    .error {
        background: #f8d7da;
        color: #721c24;
    }
</style>
</head>
<body>

<h2>Centralized Error Handling Example</h2>

<button onclick="loadData()">Load Data</button>
<button onclick="generateError()">Generate Error</button>

<div id="message"></div>

<script>
const messageBox = document.getElementById("message");

/* Centralized Error Handler */
function handleError(error, source = "Application") {
    console.error(`[${source}]`, error);

    messageBox.className = "error";
    messageBox.style.display = "block";
    messageBox.innerHTML =
        `<strong>Error:</strong> ${error.message || error}`;
}

/* Success Message */
function showSuccess(message) {
    messageBox.className = "success";
    messageBox.style.display = "block";
    messageBox.innerHTML = message;
}

/* API Call Example */
async function loadData() {
    try {
        const response = await fetch(
            "https://jsonplaceholder.typicode.com/users"
        );

        if (!response.ok) {
            throw new Error(
                `HTTP Error: ${response.status}`
            );
        }

        const data = await response.json();

        showSuccess(
            `Successfully loaded ${data.length} records`
        );

    } catch (error) {
        handleError(error, "API Request");
    }
}

/* Manual Error Example */
function generateError() {
    try {
        throw new Error(
            "This is a custom application error"
        );
    } catch (error) {
        handleError(error, "Custom Function");
    }
}

/* Global JavaScript Error Handler */
window.onerror = function(
    message,
    source,
    lineno,
    colno,
    error
) {
    handleError(
        error || new Error(message),
        "Global Error"
    );

    return true;
};

/* Unhandled Promise Rejection Handler */
window.addEventListener(
    "unhandledrejection",
    function(event) {
        handleError(
            event.reason,
            "Unhandled Promise"
        );
    }
);
</script>

</body>
</html>
