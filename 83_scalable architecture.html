<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalable Architecture Diagram</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .layer {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .box {
            background: white;
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 15px;
            margin: 10px;
            min-width: 180px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .arrow {
            font-size: 28px;
            color: #555;
            margin: 5px 0;
        }

        h1 {
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Scalable Web Application Architecture</h1>

    <div class="layer">
        <div class="box">Users / Clients</div>
    </div>

    <div class="arrow">↓</div>

    <div class="layer">
        <div class="box">CDN</div>
        <div class="box">Load Balancer</div>
    </div>

    <div class="arrow">↓</div>

    <div class="layer">
        <div class="box">Web Server 1</div>
        <div class="box">Web Server 2</div>
        <div class="box">Web Server N</div>
    </div>

    <div class="arrow">↓</div>

    <div class="layer">
        <div class="box">API Gateway</div>
    </div>

    <div class="arrow">↓</div>

    <div class="layer">
        <div class="box">Authentication Service</div>
        <div class="box">User Service</div>
        <div class="box">Product Service</div>
        <div class="box">Order Service</div>
    </div>

    <div class="arrow">↓</div>

    <div class="layer">
        <div class="box">Redis Cache</div>
        <div class="box">Message Queue</div>
    </div>

    <div class="arrow">↓</div>

    <div class="layer">
        <div class="box">Primary Database</div>
        <div class="box">Read Replica</div>
    </div>

    <div class="arrow">↓</div>

    <div class="layer">
        <div class="box">Monitoring & Logging</div>
    </div>

</div>

</body>
</html>
