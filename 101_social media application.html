<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0f2f5;
}

header{
    background:#1877f2;
    color:white;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:800px;
    margin:20px auto;
    padding:10px;
}

.profile{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.profile img{
    width:100px;
    height:100px;
    border-radius:50%;
}

.post-box{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:100px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    resize:none;
}

button{
    background:#1877f2;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#145dbf;
}

.post{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.post-header{
    font-weight:bold;
    margin-bottom:10px;
}

.post-content{
    margin-bottom:10px;
}

.actions{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.comment-box{
    display:flex;
    gap:10px;
}

.comment-box input{
    flex:1;
    padding:8px;
}

.comment{
    margin-top:5px;
    padding:5px;
    background:#f5f5f5;
    border-radius:5px;
}

@media(max-width:600px){
    .container{
        padding:5px;
    }
}
</style>
</head>
<body>

<header>Social Media App</header>

<div class="container">

    <div class="profile">
        <img src="https://via.placeholder.com/100" alt="Profile">
        <h2>John Doe</h2>
        <p>Web Developer</p>
    </div>

    <div class="post-box">
        <h3>Create Post</h3>
        <textarea id="postText" placeholder="What's on your mind?"></textarea>
        <button onclick="createPost()">Post</button>
    </div>

    <div id="posts"></div>

</div>

<script>
function createPost() {
    let text = document.getElementById("postText").value;

    if(text.trim() === ""){
        alert("Please enter a post.");
        return;
    }

    let post = document.createElement("div");
    post.className = "post";

    post.innerHTML = `
        <div class="post-header">John Doe</div>
        <div class="post-content">${text}</div>

        <div class="actions">
            <button onclick="likePost(this)">👍 Like (<span>0</span>)</button>
        </div>

        <div class="comments"></div>

        <div class="comment-box">
            <input type="text" placeholder="Write a comment...">
            <button onclick="addComment(this)">Comment</button>
        </div>
    `;

    document.getElementById("posts").prepend(post);
    document.getElementById("postText").value = "";
}

function likePost(button){
    let count = button.querySelector("span");
    count.innerText = parseInt(count.innerText) + 1;
}

function addComment(button){
    let input = button.previousElementSibling;
    let commentsDiv = button.parentElement.previousElementSibling;

    if(input.value.trim() === ""){
        return;
    }

    let comment = document.createElement("div");
    comment.className = "comment";
    comment.innerText = input.value;

    commentsDiv.appendChild(comment);
    input.value = "";
}
</script>

</body>
</html>
