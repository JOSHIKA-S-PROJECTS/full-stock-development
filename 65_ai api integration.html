<!DOCTYPE html>
<html>
<head>
    <title>AI Chat Integration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
        }

        #chatBox {
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        .user {
            text-align: right;
            margin: 10px;
        }

        .assistant {
            text-align: left;
            margin: 10px;
        }

        textarea {
            width: 100%;
            height: 80px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h2>AI Chatbot</h2>

<div id="chatBox"></div>

<textarea id="prompt"
          placeholder="Ask something..."></textarea>

<button onclick="sendMessage()">Send</button>

<script>
async function sendMessage() {

    const promptInput = document.getElementById("prompt");
    const prompt = promptInput.value.trim();

    if (!prompt) return;

    const chatBox = document.getElementById("chatBox");

    chatBox.innerHTML += `
        <div class="user">
            <strong>You:</strong> ${prompt}
        </div>
    `;

    promptInput.value = "";

    try {

        const response = await fetch("/api/ai-chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: prompt
            })
        });

        const data = await response.json();

        chatBox.innerHTML += `
            <div class="assistant">
                <strong>AI:</strong> ${data.reply}
            </div>
        `;

        chatBox.scrollTop = chatBox.scrollHeight;

    } catch (error) {

        chatBox.innerHTML += `
            <div class="assistant">
                <strong>Error:</strong>
                Unable to connect to AI service.
            </div>
        `;
    }
}
</script>

</body>
</html>
