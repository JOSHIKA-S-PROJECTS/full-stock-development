<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f7fb;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.cart-container{
    width:100%;
    max-width:1000px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,0.12);
}

.cart-header{
    background:#2563eb;
    color:#fff;
    padding:25px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.cart-header h2{
    font-size:28px;
}

.cart-count{
    background:rgba(255,255,255,0.2);
    padding:8px 15px;
    border-radius:30px;
}

.cart-body{
    padding:25px;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:20px;
    padding:20px 0;
    border-bottom:1px solid #e5e7eb;
}

.product-image{
    width:110px;
    height:110px;
    border-radius:12px;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-details{
    flex:1;
}

.product-title{
    font-size:20px;
    font-weight:600;
    color:#1e293b;
    margin-bottom:8px;
}

.product-category{
    color:#64748b;
    margin-bottom:10px;
}

.product-price{
    color:#2563eb;
    font-size:22px;
    font-weight:bold;
}

.quantity-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.qty-btn{
    width:35px;
    height:35px;
    border:none;
    border-radius:50%;
    background:#e2e8f0;
    cursor:pointer;
    font-size:18px;
}

.qty{
    font-weight:bold;
    min-width:20px;
    text-align:center;
}

.remove-btn{
    background:#ef4444;
    color:#fff;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.cart-footer{
    padding:25px 30px;
    background:#f8fafc;
}

.summary{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    color:#475569;
}

.total{
    font-size:24px;
    font-weight:bold;
    color:#111827;
    margin-top:10px;
}

.checkout-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.checkout-btn:hover{
    background:#1d4ed8;
}

@media(max-width:768px){

    .cart-item{
        flex-direction:column;
        text-align:center;
    }

    .quantity-box{
        justify-content:center;
    }

    .cart-header{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>
<body>

<div class="cart-container">

    <div class="cart-header">
        <h2>🛒 Shopping Cart</h2>
        <div class="cart-count">3 Items</div>
    </div>

    <div class="cart-body">

        <!-- Item 1 -->
        <div class="cart-item">
            <div class="product-image">
                <img src="https://via.placeholder.com/150" alt="">
            </div>

            <div class="product-details">
                <div class="product-title">Wireless Headphones</div>
                <div class="product-category">Electronics</div>
                <div class="product-price">$99.00</div>
            </div>

            <div class="quantity-box">
                <button class="qty-btn">−</button>
                <span class="qty">1</span>
                <button class="qty-btn">+</button>
            </div>

            <button class="remove-btn">Remove</button>
        </div>

        <!-- Item 2 -->
        <div class="cart-item">
            <div class="product-image">
                <img src="https://via.placeholder.com/150" alt="">
            </div>

            <div class="product-details">
                <div class="product-title">Smart Watch</div>
                <div class="product-category">Accessories</div>
                <div class="product-price">$149.00</div>
            </div>

            <div class="quantity-box">
                <button class="qty-btn">−</button>
                <span class="qty">2</span>
                <button class="qty-btn">+</button>
            </div>

            <button class="remove-btn">Remove</button>
        </div>

        <!-- Item 3 -->
        <div class="cart-item">
            <div class="product-image">
                <img src="https://via.placeholder.com/150" alt="">
            </div>

            <div class="product-details">
                <div class="product-title">Gaming Mouse</div>
                <div class="product-category">Gaming</div>
                <div class="product-price">$59.00</div>
            </div>

            <div class="quantity-box">
                <button class="qty-btn">−</button>
                <span class="qty">1</span>
                <button class="qty-btn">+</button>
            </div>

            <button class="remove-btn">Remove</button>
        </div>

    </div>

    <div class="cart-footer">

        <div class="summary">
            <span>Subtotal</span>
            <span>$307.00</span>
        </div>

        <div class="summary">
            <span>Shipping</span>
            <span>$15.00</span>
        </div>

        <div class="summary">
            <span>Tax</span>
            <span>$12.00</span>
        </div>

        <div class="summary total">
            <span>Total</span>
            <span>$334.00</span>
        </div>

        <button class="checkout-btn">
            Proceed to Checkout
        </button>

    </div>

</div>

</body>
</html>
