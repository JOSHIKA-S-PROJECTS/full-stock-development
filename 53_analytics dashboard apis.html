<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Dashboard</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background:#f4f4f4;
        margin:20px;
    }

    .dashboard{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
        gap:20px;
    }

    .card{
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    h2{
        margin-top:0;
    }

    .value{
        font-size:30px;
        font-weight:bold;
        color:#007bff;
    }

    button{
        padding:10px 20px;
        margin-bottom:20px;
        cursor:pointer;
    }
</style>
</head>
<body>

<h1>Analytics Dashboard</h1>

<button onclick="loadAnalytics()">Refresh Data</button>

<div class="dashboard">

    <div class="card">
        <h2>Total Users</h2>
        <div id="users" class="value">0</div>
    </div>

    <div class="card">
        <h2>Total Sales</h2>
        <div id="sales" class="value">0</div>
    </div>

    <div class="card">
        <h2>Orders</h2>
        <div id="orders" class="value">0</div>
    </div>

    <div class="card">
        <h2>Revenue</h2>
        <div id="revenue" class="value">₹0</div>
    </div>

</div>

<script>

async function loadAnalytics() {

    try {

        // Example Analytics API
        const response = await fetch(
            "http://localhost:3000/api/analytics"
        );

        const data = await response.json();

        document.getElementById("users").textContent =
            data.totalUsers;

        document.getElementById("sales").textContent =
            data.totalSales;

        document.getElementById("orders").textContent =
            data.totalOrders;

        document.getElementById("revenue").textContent =
            "₹" + data.revenue;

    } catch(error) {
        console.error("Error:", error);
    }
}

loadAnalytics();

</script>

</body>
</html>
