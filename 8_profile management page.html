<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Management</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.profile-container{
    background:#fff;
    width:90%;
    max-width:800px;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.profile-header{
    text-align:center;
    margin-bottom:30px;
}

.profile-header img{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid #3498db;
    object-fit:cover;
}

.profile-header h2{
    margin-top:15px;
    color:#333;
}

.profile-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    margin-bottom:5px;
    font-weight:bold;
    color:#555;
}

.form-group input,
.form-group textarea{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

.form-group textarea{
    resize:vertical;
}

.full-width{
    grid-column:1 / -1;
}

.btn{
    grid-column:1 / -1;
    padding:12px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

.btn:hover{
    background:#2980b9;
}

@media(max-width:768px){
    .profile-form{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="profile-container">

    <div class="profile-header">
        <img src="https://via.placeholder.com/120" alt="Profile Picture">
        <h2>John Doe</h2>
        <p>Profile Management</p>
    </div>

    <form class="profile-form">

        <div class="form-group">
            <label>First Name</label>
            <input type="text" value="John">
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" value="Doe">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" value="john@example.com">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" value="+91 9876543210">
        </div>

        <div class="form-group full-width">
            <label>Address</label>
            <textarea rows="3">123 Main Street, City, Country</textarea>
        </div>

        <div class="form-group full-width">
            <label>Bio</label>
            <textarea rows="4">Tell us something about yourself...</textarea>
        </div>

        <button type="submit" class="btn">
            Update Profile
        </button>

    </form>

</div>

</body>
</html>
