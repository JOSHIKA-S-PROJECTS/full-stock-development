<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    background:#f4f6f9;
}

/* Sidebar */
.sidebar{
    width:250px;
    height:100vh;
    background:#2c3e50;
    color:white;
    padding:20px;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    padding:15px;
    margin:10px 0;
    background:#34495e;
    border-radius:8px;
    cursor:pointer;
}

.sidebar ul li:hover{
    background:#1abc9c;
}

/* Main Content */
.main{
    flex:1;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    padding:15px 20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    text-align:center;
}

.card h3{
    color:#555;
}

.card p{
    font-size:28px;
    font-weight:bold;
    color:#1abc9c;
    margin-top:10px;
}

/* Table */
.table-container{
    margin-top:30px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    padding:12px;
    text-align:left;
    border-bottom:1px solid #ddd;
}

th{
    background:#1abc9c;
    color:white;
}
</style>
</head>
<body>

<div class="sidebar">
    <h2>Dashboard</h2>
    <ul>
        <li>🏠 Home</li>
        <li>📊 Analytics</li>
        <li>👥 Users</li>
        <li>📦 Products</li>
        <li>⚙ Settings</li>
    </ul>
</div>

<div class="main">

    <div class="header">
        <h1>Admin Dashboard</h1>
        <h3>Welcome, User</h3>
    </div>

    <div class="cards">
        <div class="card">
            <h3>Total Users</h3>
            <p>1,250</p>
        </div>

        <div class="card">
            <h3>Sales</h3>
            <p>$8,500</p>
        </div>

        <div class="card">
            <h3>Orders</h3>
            <p>320</p>
        </div>

        <div class="card">
            <h3>Revenue</h3>
            <p>$15K</p>
        </div>
    </div>

    <div class="table-container">
        <h2>Recent Orders</h2>
        <br>
        <table>
            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Status</th>
                <th>Amount</th>
            </tr>
            <tr>
                <td>#1001</td>
                <td>John</td>
                <td>Completed</td>
                <td>$120</td>
            </tr>
            <tr>
                <td>#1002</td>
                <td>Emma</td>
                <td>Pending</td>
                <td>$95</td>
            </tr>
            <tr>
                <td>#1003</td>
                <td>David</td>
                <td>Completed</td>
                <td>$210</td>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
