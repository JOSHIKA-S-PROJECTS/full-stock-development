<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
}

.container{
    width:400px;
    max-width:90%;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:10px;
    color:#333;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:20px;
    font-size:14px;
}

.input-group{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#4f46e5;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#4338ca;
}

.message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
    display:none;
}

.success{
    color:green;
}

.error{
    color:red;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
    color:#4f46e5;
}
</style>
</head>
<body>

<div class="container">
    <h2>Forgot Password</h2>
    <p>Enter your registered email address to receive a password reset link.</p>

    <div class="input-group">
        <input type="email" id="email" placeholder="Enter your email">
    </div>

    <button onclick="sendResetLink()">Send Reset Link</button>

    <div id="message" class="message"></div>

    <a href="login.html" class="back-link">← Back to Login</a>
</div>

<script>
function sendResetLink() {
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message");

    const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;

    if(email === "") {
        message.style.display = "block";
        message.className = "message error";
        message.innerText = "Please enter your email address.";
        return;
    }

    if(!emailPattern.test(email)) {
        message.style.display = "block";
        message.className = "message error";
        message.innerText = "Please enter a valid email address.";
        return;
    }

    // Simulated API call
    setTimeout(() => {
        message.style.display = "block";
        message.className = "message success";
        message.innerText =
            "Password reset link has been sent to " + email;
    }, 1000);
}
</script>

</body>
</html>
