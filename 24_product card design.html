<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Card Design</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f9;
    padding:20px;
}

.product-card{
    width:320px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
    transition:0.3s ease;
}

.product-card:hover{
    transform:translateY(-8px);
}

.product-image{
    position:relative;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:280px;
    object-fit:cover;
    transition:0.4s;
}

.product-card:hover .product-image img{
    transform:scale(1.08);
}

.badge{
    position:absolute;
    top:15px;
    left:15px;
    background:#ef4444;
    color:#fff;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.wishlist{
    position:absolute;
    top:15px;
    right:15px;
    width:40px;
    height:40px;
    background:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:18px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

.product-content{
    padding:22px;
}

.category{
    color:#64748b;
    font-size:14px;
    margin-bottom:8px;
}

.product-title{
    font-size:22px;
    font-weight:700;
    color:#1e293b;
    margin-bottom:10px;
}

.description{
    color:#64748b;
    font-size:14px;
    line-height:1.6;
    margin-bottom:15px;
}

.rating{
    margin-bottom:15px;
    color:#f59e0b;
}

.price-section{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.price{
    font-size:28px;
    font-weight:700;
    color:#2563eb;
}

.old-price{
    color:#94a3b8;
    text-decoration:line-through;
}

.actions{
    display:flex;
    gap:12px;
}

.btn{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.cart-btn{
    background:#2563eb;
    color:white;
}

.cart-btn:hover{
    background:#1d4ed8;
}

.buy-btn{
    background:#e2e8f0;
    color:#1e293b;
}

.buy-btn:hover{
    background:#cbd5e1;
}
</style>
</head>
<body>

<div class="product-card">

    <div class="product-image">
        <img src="https://via.placeholder.com/400x300" alt="Product">
        <span class="badge">20% OFF</span>
        <div class="wishlist">♡</div>
    </div>

    <div class="product-content">

        <div class="category">Electronics</div>

        <h2 class="product-title">
            Wireless Headphones
        </h2>

        <p class="description">
            Premium noise-cancelling wireless headphones
            with crystal-clear sound quality and long battery life.
        </p>

        <div class="rating">
            ★★★★★ (4.8)
        </div>

        <div class="price-section">
            <span class="price">$99</span>
            <span class="old-price">$129</span>
        </div>

        <div class="actions">
            <button class="btn cart-btn">
                Add to Cart
            </button>

            <button class="btn buy-btn">
                Buy Now
            </button>
        </div>

    </div>

</div>

</body>
</html>
