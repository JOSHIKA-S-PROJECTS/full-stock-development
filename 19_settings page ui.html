<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings Page UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f1f5f9;
    color:#0f172a;
}

/* Layout */
.settings-page{
    max-width:1100px;
    margin:40px auto;
    padding:20px;
}

/* Header */
.header{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 15px rgba(0,0,0,0.06);
    margin-bottom:20px;
}

.header h1{
    margin-bottom:5px;
}

.header p{
    color:#64748b;
}

/* Grid */
.settings-grid{
    display:grid;
    grid-template-columns:260px 1fr;
    gap:20px;
}

/* Sidebar */
.sidebar{
    background:white;
    border-radius:16px;
    padding:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.06);
    height:fit-content;
}

.sidebar a{
    display:block;
    padding:12px;
    margin-bottom:8px;
    text-decoration:none;
    color:#334155;
    border-radius:10px;
    transition:0.3s;
}

.sidebar a:hover,
.sidebar a.active{
    background:#2563eb;
    color:white;
}

/* Content */
.content{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,0.06);
}

/* Section */
.section{
    margin-bottom:30px;
}

.section h2{
    margin-bottom:15px;
    font-size:18px;
    color:#0f172a;
}

/* Form */
.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#334155;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    transition:0.3s;
}

input:focus,
select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

/* Toggle */
.toggle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #e2e8f0;
}

.switch{
    width:50px;
    height:26px;
    background:#cbd5e1;
    border-radius:30px;
    position:relative;
    cursor:pointer;
}

.switch::after{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    background:white;
    border-radius:50%;
    top:3px;
    left:3px;
    transition:0.3s;
}

.switch.active{
    background:#2563eb;
}

.switch.active::after{
    left:26px;
}

/* Buttons */
.btn{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.save{
    background:#2563eb;
    color:white;
}

.cancel{
    background:#e2e8f0;
    color:#0f172a;
}

/* Responsive */
@media(max-width:900px){
    .settings-grid{
        grid-template-columns:1fr;
    }

    .sidebar{
        display:flex;
        overflow-x:auto;
        gap:10px;
    }

    .sidebar a{
        white-space:nowrap;
        margin-bottom:0;
    }
}
</style>
</head>
<body>

<div class="settings-page">

    <!-- Header -->
    <div class="header">
        <h1>Settings</h1>
        <p>Manage your account preferences and configurations</p>
    </div>

    <div class="settings-grid">

        <!-- Sidebar -->
        <div class="sidebar">
            <a href="#" class="active">Account</a>
            <a href="#">Profile</a>
            <a href="#">Security</a>
            <a href="#">Notifications</a>
            <a href="#">Privacy</a>
            <a href="#">Billing</a>
        </div>

        <!-- Content -->
        <div class="content">

            <!-- Account Section -->
            <div class="section">
                <h2>Account Information</h2>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter email">
                </div>

                <div class="form-group">
                    <label>Language</label>
                    <select>
                        <option>English</option>
                        <option>Hindi</option>
                        <option>Tamil</option>
                    </select>
                </div>
            </div>

            <!-- Security Section -->
            <div class="section">
                <h2>Security</h2>

                <div class="form-group">
                    <label>Change Password</label>
                    <input type="password" placeholder="New password">
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm password">
                </div>
            </div>

            <!-- Notifications -->
            <div class="section">
                <h2>Notifications</h2>

                <div class="toggle">
                    <span>Email Notifications</span>
                    <div class="switch"></div>
                </div>

                <div class="toggle">
                    <span>Push Notifications</span>
                    <div class="switch active"></div>
                </div>

                <div class="toggle">
                    <span>SMS Alerts</span>
                    <div class="switch"></div>
                </div>
            </div>

            <!-- Buttons -->
            <div style="display:flex; gap:10px;">
                <button class="btn save">Save Changes</button>
                <button class="btn cancel">Cancel</button>
            </div>

        </div>

    </div>

</div>

</body>
</html>
