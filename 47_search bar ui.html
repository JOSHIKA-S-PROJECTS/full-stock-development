<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Bar UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.search-container{
    width:450px;
    max-width:90%;
}

.search-box{
    display:flex;
    align-items:center;
    background:#fff;
    border-radius:50px;
    padding:8px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.search-box input{
    flex:1;
    border:none;
    outline:none;
    padding:14px 20px;
    font-size:16px;
    border-radius:50px;
}

.search-box button{
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:#667eea;
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.search-box button:hover{
    background:#5a67d8;
    transform:scale(1.05);
}
</style>
</head>
<body>

<div class="search-container">
    <div class="search-box">
        <input type="text" placeholder="Search here...">
        <button>&#128269;</button>
    </div>
</div>

</body>
</html>
