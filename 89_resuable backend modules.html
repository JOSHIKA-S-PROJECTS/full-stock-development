<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reusable Backend Modules</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f4f4f4;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.module {
    border: 1px solid #ddd;
    padding: 15px;
    margin: 10px 0;
    border-radius: 5px;
}

h2 {
    color: #007bff;
}
</style>
</head>
<body>

<div class="container">

<h1>Reusable Backend Modules</h1>

<div class="module">
    <h2>Logger Module</h2>
    <p>Handles application logging.</p>
</div>

<div class="module">
    <h2>Database Module</h2>
    <p>Provides database connection and queries.</p>
</div>

<div class="module">
    <h2>Authentication Module</h2>
    <p>Handles JWT authentication.</p>
</div>

<div class="module">
    <h2>Validation Module</h2>
    <p>Validates incoming requests.</p>
</div>

<div class="module">
    <h2>Response Module</h2>
    <p>Creates standard API responses.</p>
</div>

</div>

</body>
</html>
