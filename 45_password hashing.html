<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Password Hashing</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 30px auto;
        padding: 20px;
    }

    input, button {
        padding: 10px;
        margin: 5px;
        width: 100%;
    }

    textarea {
        width: 100%;
        height: 120px;
        margin-top: 10px;
    }
</style>
</head>
<body>

<h2>Secure Password Hashing Example</h2>

<input
    type="password"
    id="password"
    placeholder="Enter Password">

<button onclick="hashPassword()">
    Generate Hash
</button>

<textarea
    id="result"
    readonly
    placeholder="Hashed password will appear here">
</textarea>

<script>
async function hashPassword() {

    const password =
        document.getElementById("password").value;

    if (!password) {
        alert("Please enter a password");
        return;
    }

    const encoder = new TextEncoder();
    const data = encoder.encode(password);

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    const hashArray =
        Array.from(new Uint8Array(hashBuffer));

    const hashHex =
        hashArray
            .map(byte =>
                byte.toString(16).padStart(2, "0"))
            .join("");

    document.getElementById("result").value =
        hashHex;
}
</script>

</body>
</html>
