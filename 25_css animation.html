<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animations Demo</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f4f4;
        text-align: center;
        padding: 50px;
    }

    h1 {
        margin-bottom: 30px;
    }

    /* Fade In Animation */
    .fade-in {
        opacity: 0;
        animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* Slide In Animation */
    .slide-in {
        position: relative;
        animation: slideIn 1.5s ease-out;
        margin: 30px 0;
    }

    @keyframes slideIn {
        from {
            left: -300px;
            opacity: 0;
        }
        to {
            left: 0;
            opacity: 1;
        }
    }

    /* Bouncing Button */
    .bounce-btn {
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        animation: bounce 2s infinite;
    }

    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
            transform: translateY(0);
        }
        40% {
            transform: translateY(-15px);
        }
        60% {
            transform: translateY(-8px);
        }
    }

    /* Rotating Loader */
    .loader {
        width: 60px;
        height: 60px;
        border: 6px solid #ddd;
        border-top: 6px solid #2563eb;
        border-radius: 50%;
        margin: 40px auto;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }

    /* Hover Card Effect */
    .card {
        width: 250px;
        background: white;
        padding: 20px;
        margin: 30px auto;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        transition: transform 0.4s, box-shadow 0.4s;
    }

    .card:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
</style>
</head>
<body>

    <h1 class="fade-in">CSS Animation Examples</h1>

    <div class="slide-in">
        <h2>Sliding Content</h2>
        <p>This section slides in from the left.</p>
    </div>

    <button class="bounce-btn">
        Animated Button
    </button>

    <div class="loader"></div>

    <div class="card">
        <h3>Hover Card</h3>
        <p>Move your mouse over this card to see the animation.</p>
    </div>

</body>
</html>
