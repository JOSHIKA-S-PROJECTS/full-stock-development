<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internship Management System</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#333;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input, select, textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.add-btn{
    background:#28a745;
    color:white;
}

.delete-btn{
    background:#dc3545;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th, table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

table th{
    background:#007bff;
    color:white;
}

.status-active{
    color:green;
    font-weight:bold;
}

.status-completed{
    color:blue;
    font-weight:bold;
}

.status-pending{
    color:orange;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

    <h1>Internship Management System</h1>

    <div class="form-group">
        <label>Student Name</label>
        <input type="text" id="studentName">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email">
    </div>

    <div class="form-group">
        <label>Company</label>
        <input type="text" id="company">
    </div>

    <div class="form-group">
        <label>Internship Role</label>
        <input type="text" id="role">
    </div>

    <div class="form-group">
        <label>Duration</label>
        <input type="text" id="duration" placeholder="e.g. 3 Months">
    </div>

    <div class="form-group">
        <label>Status</label>
        <select id="status">
            <option>Active</option>
            <option>Completed</option>
            <option>Pending</option>
        </select>
    </div>

    <button class="add-btn" onclick="addInternship()">
        Add Internship
    </button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Email</th>
                <th>Company</th>
                <th>Role</th>
                <th>Duration</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="internshipTable"></tbody>
    </table>

</div>

<script>

let internships = [];
let internshipId = 1;

function addInternship(){

    let studentName = document.getElementById("studentName").value;
    let email = document.getElementById("email").value;
    let company = document.getElementById("company").value;
    let role = document.getElementById("role").value;
    let duration = document.getElementById("duration").value;
    let status = document.getElementById("status").value;

    if(
        studentName === "" ||
        email === "" ||
        company === "" ||
        role === "" ||
        duration === ""
    ){
        alert("Please fill all fields");
        return;
    }

    internships.push({
        id: internshipId++,
        studentName,
        email,
        company,
        role,
        duration,
        status
    });

    clearForm();
    displayInternships();
}

function displayInternships(){

    let table = document.getElementById("internshipTable");
    table.innerHTML = "";

    internships.forEach(item => {

        let statusClass = "";

        if(item.status === "Active"){
            statusClass = "status-active";
        }
        else if(item.status === "Completed"){
            statusClass = "status-completed";
        }
        else{
            statusClass = "status-pending";
        }

        table.innerHTML += `
        <tr>
            <td>${item.id}</td>
            <td>${item.studentName}</td>
            <td>${item.email}</td>
            <td>${item.company}</td>
            <td>${item.role}</td>
            <td>${item.duration}</td>
            <td class="${statusClass}">
                ${item.status}
            </td>
            <td>
                <button class="delete-btn"
                onclick="deleteInternship(${item.id})">
                Delete
                </button>
            </td>
        </tr>`;
    });
}

function deleteInternship(id){

    if(confirm("Delete this internship record?")){
        internships = internships.filter(
            internship => internship.id !== id
        );

        displayInternships();
    }
}

function clearForm(){

    document.getElementById("studentName").value = "";
    document.getElementById("email").value = "";
    document.getElementById("company").value = "";
    document.getElementById("role").value = "";
    document.getElementById("duration").value = "";
    document.getElementById("status").value = "Active";
}

</script>

</body>
</html>
