<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f8fafc;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

/* Contact Section */
.contact-section{
    width:100%;
    max-width:1200px;
}

.contact-container{
    display:grid;
    grid-template-columns:1fr 1.2fr;
    background:#ffffff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.1);
}

/* Left Panel */
.contact-info{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    padding:50px;
}

.contact-info h2{
    font-size:2rem;
    margin-bottom:15px;
}

.contact-info p{
    line-height:1.8;
    margin-bottom:30px;
    opacity:0.9;
}

.info-item{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.info-icon{
    width:45px;
    height:45px;
    background:rgba(255,255,255,0.15);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.social-links{
    display:flex;
    gap:12px;
    margin-top:30px;
}

.social-links a{
    width:40px;
    height:40px;
    background:rgba(255,255,255,0.15);
    color:white;
    text-decoration:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.3s;
}

.social-links a:hover{
    background:white;
    color:#2563eb;
}

/* Right Panel */
.contact-form{
    padding:50px;
}

.contact-form h2{
    margin-bottom:10px;
    color:#0f172a;
}

.contact-form p{
    color:#64748b;
    margin-bottom:30px;
}

/* Form */
.form-group{
    margin-bottom:20px;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    transition:.3s;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

textarea{
    min-height:140px;
    resize:vertical;
}

.submit-btn{
    width:100%;
    border:none;
    padding:15px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:600;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    background:#1d4ed8;
}

/* Responsive */
@media(max-width:900px){

    .contact-container{
        grid-template-columns:1fr;
    }

    .form-row{
        grid-template-columns:1fr;
    }

    .contact-info,
    .contact-form{
        padding:35px;
    }
}

@media(max-width:500px){

    .contact-info,
    .contact-form{
        padding:25px;
    }

    .contact-info h2,
    .contact-form h2{
        font-size:1.6rem;
    }
}
</style>
</head>
<body>

<section class="contact-section">

    <div class="contact-container">

        <!-- Contact Information -->
        <div class="contact-info">

            <h2>Get In Touch</h2>

            <p>
                We'd love to hear from you. Send us a message
                and our team will respond as soon as possible.
            </p>

            <div class="info-item">
                <div class="info-icon">📍</div>
                <div>
                    <strong>Address</strong><br>
                    123 Business Street, City, Country
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon">📞</div>
                <div>
                    <strong>Phone</strong><br>
                    +1 234 567 890
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon">✉️</div>
                <div>
                    <strong>Email</strong><br>
                    contact@example.com
                </div>
            </div>

            <div class="social-links">
                <a href="#">F</a>
                <a href="#">X</a>
                <a href="#">L</a>
                <a href="#">I</a>
            </div>

        </div>

        <!-- Contact Form -->
        <div class="contact-form">

            <h2>Send a Message</h2>

            <p>
                Fill out the form below and we'll get back to you shortly.
            </p>

            <form>

                <div class="form-row">

                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" placeholder="Enter first name">
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Enter last name">
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="Enter email">
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" placeholder="Enter phone number">
                    </div>

                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <select>
                        <option>Select Subject</option>
                        <option>General Inquiry</option>
                        <option>Project Discussion</option>
                        <option>Technical Support</option>
                        <option>Partnership</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Send Message
                </button>

            </form>

        </div>

    </div>

</section>

</body>
</html>
