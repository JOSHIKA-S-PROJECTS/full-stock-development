<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Mode Demo</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background-color: #ffffff;
        color: #333333;
        transition: background-color 0.3s, color 0.3s;
        padding: 30px;
    }

    /* Dark Theme */
    body.dark-mode {
        background-color: #121212;
        color: #f5f5f5;
    }

    .container {
        max-width: 800px;
        margin: auto;
    }

    .card {
        background: #f4f4f4;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
        transition: background-color 0.3s;
    }

    body.dark-mode .card {
        background: #1e1e1e;
    }

    .toggle-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }

    body.dark-mode .toggle-btn {
        background: #f5f5f5;
        color: #121212;
    }
</style>
</head>
<body>

<div class="container">
    <button class="toggle-btn" onclick="toggleDarkMode()">
        🌙 Toggle Dark Mode
    </button>

    <div class="card">
        <h2>Dark Mode Example</h2>
        <p>
            Click the button above to switch between light and dark themes.
        </p>
    </div>
</div>

<script>
function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
}
</script>

</body>
</html>
