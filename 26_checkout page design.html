<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f7fb;
    padding:40px 20px;
}

.checkout-container{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:30px;
}

/* Form Section */
.checkout-form{
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.section-title{
    font-size:24px;
    margin-bottom:20px;
    color:#1e293b;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    margin-bottom:18px;
}

.form-group.full{
    grid-column:1 / -1;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #dbe2ea;
    border-radius:10px;
    outline:none;
    transition:0.3s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    resize:none;
    height:100px;
}

.payment-method{
    margin-top:20px;
}

.radio-option{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border:1px solid #e2e8f0;
    border-radius:10px;
    margin-bottom:10px;
}

/* Order Summary */
.order-summary{
    background:#fff;
    padding:30px;
    border-radius:20px;
    height:fit-content;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.product{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.product img{
    width:70px;
    height:70px;
    border-radius:10px;
    object-fit:cover;
}

.product-name{
    font-weight:600;
}

.product-price{
    color:#2563eb;
    font-weight:bold;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin:12px 0;
    color:#475569;
}

.total{
    font-size:22px;
    font-weight:bold;
    color:#111827;
    border-top:1px solid #e2e8f0;
    padding-top:15px;
    margin-top:15px;
}

.coupon{
    display:flex;
    gap:10px;
    margin:20px 0;
}

.coupon input{
    flex:1;
}

.apply-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
}

.place-order{
    width:100%;
    background:#16a34a;
    color:white;
    border:none;
    padding:16px;
    border-radius:12px;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.place-order:hover{
    background:#15803d;
}

/* Responsive */
@media(max-width:900px){

    .checkout-container{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="checkout-container">

    <!-- Billing Details -->
    <div class="checkout-form">

        <h2 class="section-title">Billing Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>First Name</label>
                <input type="text" placeholder="John">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" placeholder="Doe">
            </div>

            <div class="form-group full">
                <label>Email Address</label>
                <input type="email" placeholder="john@example.com">
            </div>

            <div class="form-group full">
                <label>Street Address</label>
                <input type="text" placeholder="123 Main Street">
            </div>

            <div class="form-group">
                <label>City</label>
                <input type="text" placeholder="New York">
            </div>

            <div class="form-group">
                <label>Postal Code</label>
                <input type="text" placeholder="10001">
            </div>

            <div class="form-group">
                <label>Country</label>
                <select>
                    <option>United States</option>
                    <option>India</option>
                    <option>United Kingdom</option>
                </select>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="+1 234 567 890">
            </div>

            <div class="form-group full">
                <label>Order Notes</label>
                <textarea placeholder="Additional delivery instructions..."></textarea>
            </div>

        </div>

        <div class="payment-method">
            <h2 class="section-title">Payment Method</h2>

            <div class="radio-option">
                <input type="radio" name="payment" checked>
                <span>Credit / Debit Card</span>
            </div>

            <div class="radio-option">
                <input type="radio" name="payment">
                <span>PayPal</span>
            </div>

            <div class="radio-option">
                <input type="radio" name="payment">
                <span>Cash on Delivery</span>
            </div>
        </div>

    </div>

    <!-- Order Summary -->
    <div class="order-summary">

        <h2 class="section-title">Order Summary</h2>

        <div class="product">
            <img src="https://via.placeholder.com/80" alt="">
            <div>
                <div class="product-name">Wireless Headphones</div>
                <div class="product-price">$99</div>
            </div>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/80" alt="">
            <div>
                <div class="product-name">Smart Watch</div>
                <div class="product-price">$149</div>
            </div>
        </div>

        <div class="coupon">
            <input type="text" placeholder="Coupon Code">
            <button class="apply-btn">Apply</button>
        </div>

        <div class="summary-row">
            <span>Subtotal</span>
            <span>$248.00</span>
        </div>

        <div class="summary-row">
            <span>Shipping</span>
            <span>$15.00</span>
        </div>

        <div class="summary-row">
            <span>Tax</span>
            <span>$12.00</span>
        </div>

        <div class="summary-row total">
            <span>Total</span>
            <span>$275.00</span>
        </div>

        <button class="place-order">
            Place Order
        </button>

    </div>

</div>

</body>
</html>
