<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popup Modal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f9;
}

.open-btn{
    padding:15px 30px;
    border:none;
    background:#4f46e5;
    color:#fff;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.open-btn:hover{
    background:#3730a3;
}

/* Modal Overlay */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:1000;
}

/* Modal Box */
.modal-content{
    width:90%;
    max-width:450px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    text-align:center;
    position:relative;
    animation:popup 0.3s ease;
}

@keyframes popup{
    from{
        transform:scale(0.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* Close Button */
.close{
    position:absolute;
    top:12px;
    right:15px;
    font-size:24px;
    cursor:pointer;
    color:#666;
}

.close:hover{
    color:red;
}

.modal-content h2{
    margin-bottom:15px;
    color:#222;
}

.modal-content p{
    color:#555;
    margin-bottom:20px;
    line-height:1.6;
}

.action-btn{
    padding:12px 25px;
    border:none;
    background:#10b981;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.action-btn:hover{
    background:#059669;
}
</style>
</head>
<body>

<button class="open-btn" onclick="openModal()">
    Open Modal
</button>

<div class="modal" id="popupModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>

        <h2>Welcome!</h2>
        <p>
            This is a responsive popup modal design.
            You can add forms, notifications, confirmations,
            or any custom content here.
        </p>

        <button class="action-btn" onclick="closeModal()">
            Got It
        </button>
    </div>
</div>

<script>
function openModal() {
    document.getElementById("popupModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("popupModal").style.display = "none";
}

window.onclick = function(event) {
    let modal = document.getElementById("popupModal");
    if(event.target === modal){
        closeModal();
    }
}
</script>

</body>
</html>
